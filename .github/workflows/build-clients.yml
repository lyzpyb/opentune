name: Build OpenTune (macOS DMG & Android APK)

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "macos-electron/**"
      - "android-webview/**"
      - ".github/workflows/build-clients.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "可选：填写发布 Tag（如 v1.2.0）将同步版本号并发布 Release；留空则仅执行构建验证"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-version:
    name: Resolve Version & Release Mode
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      version_code: ${{ steps.meta.outputs.version_code }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      should_release: ${{ steps.meta.outputs.should_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute version metadata
        id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            SHOULD_RELEASE="true"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${INPUT_TAG}" ]]; then
            TAG_NAME="${INPUT_TAG}"
            SHOULD_RELEASE="true"
          else
            PKG_VER="$(node -p "require('./macos-electron/package.json').version")"
            TAG_NAME="v${PKG_VER}"
            SHOULD_RELEASE="false"
          fi

          VERSION="${TAG_NAME#v}"

          # Compute monotonically increasing Android versionCode from SemVer (MAJOR*10000 + MINOR*100 + PATCH)
          if [[ "${VERSION}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            VERSION_CODE=$((10#${BASH_REMATCH[1]} * 10000 + 10#${BASH_REMATCH[2]} * 100 + 10#${BASH_REMATCH[3]}))
          else
            VERSION_CODE="${GITHUB_RUN_NUMBER}"
          fi

          echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${VERSION_CODE}" >> "${GITHUB_OUTPUT}"
          echo "should_release=${SHOULD_RELEASE}" >> "${GITHUB_OUTPUT}"
          echo "Resolved: tag=${TAG_NAME}, version=${VERSION}, versionCode=${VERSION_CODE}, release=${SHOULD_RELEASE}"

  build-macos-dmg:
    name: Build macOS (.dmg)
    needs: resolve-version
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync version & package DMG
        working-directory: macos-electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          APP_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          npm version "${APP_VERSION}" --no-git-tag-version --allow-same-version
          npm install
          npm run dist:mac

      - name: Upload macOS DMG & ZIP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opentune-macos-dmg
          path: |
            macos-electron/dist/*.dmg
            macos-electron/dist/*.zip

  build-android-apk:
    name: Build Android (.apk)
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Decode Android release keystore (if configured)
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            KEYSTORE_FILE="${RUNNER_TEMP}/opentune-release.jks"
            printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_FILE}"
            echo "ANDROID_KEYSTORE_PATH=${KEYSTORE_FILE}" >> "${GITHUB_ENV}"
            echo "Release keystore decoded to temporary runner path."
          else
            echo "::notice::ANDROID_KEYSTORE_BASE64 secret is not set; falling back to debug signing key."
          fi

      - name: Sync Android version & build APK
        working-directory: android-webview
        env:
          APP_VERSION: ${{ needs.resolve-version.outputs.version }}
          APP_VERSION_CODE: ${{ needs.resolve-version.outputs.version_code }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 -c '
          import os, re
          path = "app/build.gradle.kts"
          ver = os.environ["APP_VERSION"]
          code = os.environ["APP_VERSION_CODE"]
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()
          content = re.sub(r"versionCode\s*=\s*\d+", f"versionCode = {code}", content, count=1)
          content = re.sub(r"versionName\s*=\s*\"[^\"]+\"", f"versionName = \"{ver}\"", content, count=1)
          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          '
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi
          gradle assembleRelease

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: opentune-android-apk
          path: android-webview/app/build/outputs/apk/release/*.apk

  publish-release:
    name: Publish Direct DMG & APK Release
    needs:
      - resolve-version
      - build-macos-dmg
      - build-android-apk
    if: needs.resolve-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Collect .dmg, .zip and .apk files
        run: |
          mkdir -p dist-release
          find release-assets -type f \( -name "*.dmg" -o -name "*.zip" -o -name "*.apk" \) -exec cp {} dist-release/ \;
          ls -lh dist-release/

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag_name }}
          name: "OpenTune ${{ needs.resolve-version.outputs.tag_name }} (macOS .dmg + Android .apk)"
          body: "OpenTune ${{ needs.resolve-version.outputs.tag_name }} 自动构建发布，包含 macOS 安装镜像 (.dmg) 与 Android 安装包 (.apk)，直连官方 https://music.youtube.com 保留完整 YouTube Premium 权益。"
          generate_release_notes: true
          files: dist-release/*
