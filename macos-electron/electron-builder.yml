appId: org.opentune.client
productName: "OpenTune"
directories:
  output: dist
files:
  - src/**/*
  - build/icon.png
  - package.json
mac:
  icon: build/icon.icns
  category: public.app-category.music
  artifactName: "opentune-${version}-${arch}.${ext}"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
dmg:
  artifactName: "opentune-${version}-${arch}.dmg"
  window:
    width: 540
    height: 380
  contents:
    - x: 140
      y: 190
      type: file
    - x: 400
      y: 190
      type: link
      path: /Applications
