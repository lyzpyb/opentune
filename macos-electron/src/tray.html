<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>OpenTune Mini Player</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      html, body {
        width: 320px;
        height: 214px;
        overflow: hidden;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
        color: #f4f4f5;
      }
      .card {
        width: 100%;
        height: 100%;
        padding: 14px;
        border-radius: 14px;
        background: rgba(18, 19, 24, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.12);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .cover-wrap {
        width: 56px;
        height: 56px;
        border-radius: 10px;
        overflow: hidden;
        background: #1f222c;
        border: 1px solid rgba(255, 255, 255, 0.08);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .cover-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: none;
      }
      .cover-placeholder {
        font-size: 22px;
        color: #71717a;
      }
      .meta {
        flex: 1;
        min-width: 0;
      }
      .title {
        font-size: 13px;
        font-weight: 600;
        color: #ffffff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .artist {
        margin-top: 3px;
        font-size: 11px;
        color: #a1a1aa;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .open-btn {
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.06);
        color: #e4e4e7;
        font-size: 11px;
        padding: 4px 8px;
        border-radius: 6px;
        cursor: pointer;
        flex-shrink: 0;
      }
      .open-btn:hover {
        background: rgba(255, 255, 255, 0.14);
      }
      .progress-section {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .progress-track {
        height: 5px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
        cursor: pointer;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        width: 0%;
        background: #ff0033;
        border-radius: 999px;
        transition: width 250ms linear;
      }
      .time-row {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        font-variant-numeric: tabular-nums;
        color: #71717a;
      }
      .controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
      }
      .ctrl-btn {
        border: none;
        background: transparent;
        color: #e4e4e7;
        width: 34px;
        height: 34px;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 15px;
        transition: background 120ms ease, transform 100ms ease;
      }
      .ctrl-btn:hover {
        background: rgba(255, 255, 255, 0.12);
      }
      .ctrl-btn.primary {
        width: 40px;
        height: 40px;
        background: #ff0033;
        color: #ffffff;
        font-size: 16px;
      }
      .ctrl-btn.primary:hover {
        background: #e0002d;
      }
      .volume-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .mute-btn {
        border: none;
        background: transparent;
        color: #a1a1aa;
        width: 24px;
        height: 24px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .mute-btn:hover {
        color: #ffffff;
        background: rgba(255, 255, 255, 0.1);
      }
      input[type="range"] {
        flex: 1;
        accent-color: #ff0033;
        height: 4px;
        cursor: pointer;
      }
      .vol-value {
        width: 32px;
        text-align: right;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        color: #a1a1aa;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="header">
        <div class="cover-wrap">
          <img id="coverImg" alt="专辑封面" />
          <span id="coverPlaceholder" class="cover-placeholder">♪</span>
        </div>
        <div class="meta">
          <div id="trackTitle" class="title">未在播放</div>
          <div id="trackArtist" class="artist">OpenTune</div>
        </div>
        <button id="openMainBtn" class="open-btn" title="打开主窗口">展开</button>
      </div>

      <div class="progress-section">
        <div id="progressTrack" class="progress-track" title="点击跳转进度">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <div class="time-row">
          <span id="currentTimeLabel">0:00</span>
          <span id="durationLabel">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button id="prevBtn" class="ctrl-btn" title="上一首">⏮</button>
        <button id="playBtn" class="ctrl-btn primary" title="播放/暂停">▶</button>
        <button id="nextBtn" class="ctrl-btn" title="下一首">⏭</button>
      </div>

      <div class="volume-row">
        <button id="muteBtn" class="mute-btn" title="静音/取消静音">🔊</button>
        <input id="volumeSlider" type="range" min="0" max="100" value="100" aria-label="音量控制" />
        <span id="volumeLabel" class="vol-value">100%</span>
      </div>
    </div>

    <script>
      const coverImg = document.getElementById('coverImg');
      const coverPlaceholder = document.getElementById('coverPlaceholder');
      const trackTitle = document.getElementById('trackTitle');
      const trackArtist = document.getElementById('trackArtist');
      const progressTrack = document.getElementById('progressTrack');
      const progressFill = document.getElementById('progressFill');
      const currentTimeLabel = document.getElementById('currentTimeLabel');
      const durationLabel = document.getElementById('durationLabel');
      const prevBtn = document.getElementById('prevBtn');
      const playBtn = document.getElementById('playBtn');
      const nextBtn = document.getElementById('nextBtn');
      const muteBtn = document.getElementById('muteBtn');
      const volumeSlider = document.getElementById('volumeSlider');
      const volumeLabel = document.getElementById('volumeLabel');
      const openMainBtn = document.getElementById('openMainBtn');

      let isDraggingVolume = false;

      function fmt(sec) {
        const s = Math.max(0, Math.floor(sec || 0));
        const m = Math.floor(s / 60);
        const r = s % 60;
        return m + ':' + (r < 10 ? '0' + r : r);
      }

      prevBtn.addEventListener('click', () => window.ytmTrayBridge.sendCommand('previous'));
      playBtn.addEventListener('click', () => window.ytmTrayBridge.sendCommand('toggle'));
      nextBtn.addEventListener('click', () => window.ytmTrayBridge.sendCommand('next'));
      muteBtn.addEventListener('click', () => window.ytmTrayBridge.sendCommand('toggleMute'));
      openMainBtn.addEventListener('click', () => window.ytmTrayBridge.sendCommand('showMain'));

      progressTrack.addEventListener('click', (e) => {
        const rect = progressTrack.getBoundingClientRect();
        const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        window.ytmTrayBridge.sendCommand('seek', ratio);
      });

      volumeSlider.addEventListener('pointerdown', () => { isDraggingVolume = true; });
      window.addEventListener('pointerup', () => { isDraggingVolume = false; });
      volumeSlider.addEventListener('input', () => {
        const val = Number(volumeSlider.value);
        volumeLabel.textContent = val + '%';
        muteBtn.textContent = val === 0 ? '🔇' : val < 50 ? '🔉' : '🔊';
        window.ytmTrayBridge.sendCommand('volume', val);
      });

      window.ytmTrayBridge.onState((state) => {
        if (!state) return;
        trackTitle.textContent = state.title || '未在播放';
        trackArtist.textContent = state.artist || 'YouTube Music';
        playBtn.textContent = state.playing ? '⏸' : '▶';

        if (state.artwork) {
          if (coverImg.src !== state.artwork) coverImg.src = state.artwork;
          coverImg.style.display = 'block';
          coverPlaceholder.style.display = 'none';
        } else {
          coverImg.style.display = 'none';
          coverPlaceholder.style.display = 'block';
        }

        const dur = Number(state.duration) || 0;
        const cur = Number(state.currentTime) || 0;
        const pct = dur > 0 ? Math.max(0, Math.min(100, (cur / dur) * 100)) : 0;
        progressFill.style.width = pct + '%';
        currentTimeLabel.textContent = fmt(cur);
        durationLabel.textContent = fmt(dur);

        if (!isDraggingVolume) {
          const vol = state.muted ? 0 : (Number.isFinite(state.volume) ? state.volume : 100);
          volumeSlider.value = String(vol);
          volumeLabel.textContent = vol + '%';
          muteBtn.textContent = vol === 0 ? '🔇' : vol < 50 ? '🔉' : '🔊';
        }
      });
    </script>
  </body>
</html>
