<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 Google 账号 — OpenTune</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
        background: #0e0f14;
        color: #f4f4f6;
        padding: 26px 24px 20px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 14px;
      }
      .logo {
        width: 48px;
        height: 48px;
        border-radius: 13px;
        background: linear-gradient(135deg, #ff2a55, #d6002b);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 24px rgba(255, 0, 51, 0.32);
      }
      .logo svg {
        width: 22px;
        height: 22px;
        fill: #ffffff;
        margin-left: 2px;
      }
      h1 {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.015em;
        color: #ffffff;
      }
      .subtitle {
        font-size: 12.5px;
        line-height: 1.55;
        color: rgba(244, 244, 246, 0.68);
        max-width: 320px;
      }
      .status-box {
        width: 100%;
        font-size: 12px;
        line-height: 1.5;
        color: rgba(244, 244, 246, 0.85);
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        padding: 10px 12px;
      }
      .status-box.waiting {
        border-color: rgba(56, 189, 248, 0.4);
        background: rgba(56, 189, 248, 0.08);
        color: #bae6fd;
      }
      .status-box.success {
        border-color: rgba(34, 197, 94, 0.45);
        background: rgba(34, 197, 94, 0.1);
        color: #bbf7d0;
      }
      .status-box.error {
        border-color: rgba(248, 113, 113, 0.45);
        background: rgba(248, 113, 113, 0.1);
        color: #fecaca;
      }
      .btn-primary {
        width: 100%;
        height: 42px;
        border: none;
        border-radius: 10px;
        background: #ff0033;
        color: #ffffff;
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
        transition: background 140ms ease, opacity 140ms ease;
      }
      .btn-primary:hover { background: #e0002d; }
      .btn-primary:disabled { opacity: 0.55; cursor: default; }
      .btn-ghost {
        margin-top: auto;
        border: none;
        background: transparent;
        color: rgba(244, 244, 246, 0.58);
        font-size: 12px;
        cursor: pointer;
        padding: 6px 12px;
        border-radius: 6px;
      }
      .btn-ghost:hover {
        color: #ffffff;
        background: rgba(255, 255, 255, 0.06);
      }
    </style>
  </head>
  <body>
    <div class="logo">
      <svg viewBox="0 0 16 16"><polygon points="4.5,3 13,8 4.5,13" /></svg>
    </div>
    <h1>使用外部浏览器登录</h1>
    <p class="subtitle">将拉起本机浏览器完成 Google 安全验证，登录成功后自动同步 YouTube Premium 账号并关闭弹窗。</p>

    <div id="statusBox" class="status-box">正在检测本机浏览器...</div>

    <button id="launchBtn" class="btn-primary">打开外部浏览器登录</button>
    <button id="cancelBtn" class="btn-ghost">取消</button>

    <script>
      const statusBox = document.getElementById('statusBox');
      const launchBtn = document.getElementById('launchBtn');
      const cancelBtn = document.getElementById('cancelBtn');

      function setStatus(state, message) {
        statusBox.textContent = message || '';
        statusBox.className =
          'status-box' +
          (state === 'waiting' || state === 'syncing'
            ? ' waiting'
            : state === 'success'
              ? ' success'
              : state === 'error' || state === 'no-browser'
                ? ' error'
                : '');
      }

      window.ytmAuthBridge.onStatus((payload) => {
        if (!payload) return;
        setStatus(payload.state, payload.message);
        if (payload.browserName && payload.state === 'ready') {
          launchBtn.textContent = '使用 ' + payload.browserName + ' 登录';
          launchBtn.disabled = false;
        } else if (payload.state === 'waiting' || payload.state === 'syncing') {
          launchBtn.textContent = '等待浏览器完成登录...';
          launchBtn.disabled = true;
        } else if (payload.state === 'no-browser') {
          launchBtn.textContent = '未检测到 Chrome / Edge / Brave';
          launchBtn.disabled = true;
        } else if (payload.state === 'idle' || payload.state === 'error') {
          launchBtn.textContent = '重新打开外部浏览器登录';
          launchBtn.disabled = false;
        } else if (payload.state === 'success') {
          launchBtn.textContent = '登录成功，正在同步...';
          launchBtn.disabled = true;
        }
      });

      launchBtn.addEventListener('click', () => {
        launchBtn.disabled = true;
        launchBtn.textContent = '正在拉起浏览器...';
        window.ytmAuthBridge.startExternalBrowser();
      });

      cancelBtn.addEventListener('click', () => {
        window.ytmAuthBridge.cancel();
      });
    </script>
  </body>
</html>
