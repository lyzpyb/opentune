<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>OpenTune</title>
    <style>
      :root {
        --sidebar-w: 228px;
        --topbar-h: 54px;
        --player-h: 82px;
        --bg-sidebar: #111218;
        --bg-topbar: #0d0e13;
        --bg-player: #13141c;
        --accent: #ff0033;
        --accent-soft: rgba(255, 0, 51, 0.16);
        --accent-hover: #e0002d;
        --border: rgba(255, 255, 255, 0.08);
        --surface-hover: rgba(255, 255, 255, 0.08);
        --text-primary: #f5f5f7;
        --text-secondary: rgba(244, 244, 248, 0.82);
        --text-muted: rgba(244, 244, 248, 0.54);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg-sidebar);
        color: var(--text-primary);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .app-shell {
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
        grid-template-rows: var(--topbar-h) minmax(0, 1fr) var(--player-h);
        grid-template-areas:
          "sidebar topbar"
          "sidebar viewport"
          "player player";
      }

      /* Left High-Contrast Dark Sidebar */
      .sidebar {
        grid-area: sidebar;
        background: var(--bg-sidebar);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        padding: 0 12px 14px;
        min-height: 0;
      }

      /* Only the top traffic-light + brand region is draggable so sidebar buttons ALWAYS receive clicks */
      .sidebar-drag-header {
        padding: 46px 10px 16px;
        display: flex;
        align-items: center;
        gap: 10px;
        -webkit-app-region: drag;
        flex-shrink: 0;
      }

      .brand-mark {
        width: 26px;
        height: 26px;
        border-radius: 7px;
        background: linear-gradient(135deg, #ff2a55, #d6002b);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 3px 12px rgba(255, 0, 51, 0.38);
        flex-shrink: 0;
      }

      .brand-mark svg {
        width: 13px;
        height: 13px;
        fill: #ffffff;
        margin-left: 1px;
      }

      .brand-name {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #ffffff;
      }

      .nav-section-label {
        font-size: 11px;
        font-weight: 600;
        color: var(--text-muted);
        padding: 10px 10px 6px;
        letter-spacing: 0.03em;
      }

      .nav-list {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .nav-item {
        appearance: none;
        border: none;
        background: transparent;
        color: var(--text-secondary);
        font-size: 13px;
        font-weight: 500;
        padding: 9px 10px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        text-align: left;
        transition: background 120ms ease, color 120ms ease;
      }

      .nav-item svg {
        width: 16px;
        height: 16px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.9;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }

      .nav-item:hover {
        background: var(--surface-hover);
        color: #ffffff;
      }

      .nav-item.active {
        background: var(--accent-soft);
        color: #ffffff;
        font-weight: 600;
      }

      .nav-item.active svg {
        stroke: #ff3355;
      }

      .sidebar-spacer {
        flex: 1;
      }

      .sidebar-footer {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding-top: 12px;
        border-top: 1px solid var(--border);
      }

      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 7px 10px;
        border-radius: 8px;
        font-size: 12.5px;
        font-weight: 500;
        color: var(--text-secondary);
        cursor: pointer;
        transition: background 120ms ease, color 120ms ease;
      }

      .toggle-row:hover {
        background: var(--surface-hover);
        color: #ffffff;
      }

      .switch {
        width: 32px;
        height: 18px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.22);
        position: relative;
        transition: background 150ms ease;
        flex-shrink: 0;
      }

      .switch::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #ffffff;
        transition: transform 150ms ease;
      }

      .switch.on {
        background: var(--accent);
      }

      .switch.on::after {
        transform: translateX(14px);
      }

      .account-card {
        margin-top: 4px;
        padding: 8px 10px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 9px;
      }

      .account-avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: linear-gradient(135deg, #2b2e3d, #1c1e28);
        border: 1px solid rgba(255, 255, 255, 0.14);
        overflow: hidden;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 700;
        color: #ffffff;
      }

      .account-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: none;
      }

      .account-meta {
        flex: 1;
        min-width: 0;
      }

      .account-name {
        font-size: 12px;
        font-weight: 600;
        color: #ffffff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .account-sub {
        font-size: 10.5px;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .account-sub.online {
        color: #4ade80;
      }

      .account-mini-btn {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.07);
        color: #f4f4f5;
        font-size: 11px;
        font-weight: 500;
        padding: 4px 8px;
        border-radius: 6px;
        cursor: pointer;
        flex-shrink: 0;
      }

      .account-mini-btn:hover {
        background: rgba(255, 255, 255, 0.15);
      }

      /* Top Native Header Bar */
      .topbar {
        grid-area: topbar;
        background: var(--bg-topbar);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 0 18px;
        -webkit-app-region: drag;
        min-width: 0;
      }

      .nav-controls {
        display: flex;
        align-items: center;
        gap: 4px;
        -webkit-app-region: no-drag;
        flex-shrink: 0;
      }

      .icon-btn {
        appearance: none;
        border: none;
        background: transparent;
        color: #e4e4e7;
        width: 28px;
        height: 28px;
        border-radius: 7px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background 120ms ease, opacity 120ms ease, color 120ms ease;
      }

      .icon-btn svg {
        width: 15px;
        height: 15px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.9;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .icon-btn:hover:not(:disabled) {
        background: var(--surface-hover);
      }

      .icon-btn:disabled {
        opacity: 0.3;
        cursor: default;
      }

      .search-form {
        flex: 1;
        max-width: 440px;
        min-width: 140px;
        position: relative;
        -webkit-app-region: no-drag;
      }

      .search-form svg {
        position: absolute;
        left: 11px;
        top: 50%;
        transform: translateY(-50%);
        width: 14px;
        height: 14px;
        stroke: var(--text-muted);
        fill: none;
        stroke-width: 2;
        pointer-events: none;
      }

      .search-input {
        width: 100%;
        height: 32px;
        padding: 0 12px 0 34px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.06);
        color: #ffffff;
        font-size: 13px;
        outline: none;
        transition: border-color 140ms ease, background 140ms ease;
      }

      .search-input::placeholder {
        color: var(--text-muted);
      }

      .search-input:focus {
        border-color: rgba(255, 255, 255, 0.28);
        background: rgba(255, 255, 255, 0.1);
      }

      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        -webkit-app-region: no-drag;
        flex-shrink: 0;
      }

      .pill-btn {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.07);
        color: #f4f4f5;
        height: 30px;
        padding: 0 12px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        transition: background 120ms ease;
        white-space: nowrap;
      }

      .pill-btn:hover {
        background: rgba(255, 255, 255, 0.14);
      }

      .pill-btn.accent {
        border-color: transparent;
        background: var(--accent);
        color: #ffffff;
        display: none;
      }

      .pill-btn.accent:hover {
        background: var(--accent-hover);
      }

      .top-avatar-dot {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        object-fit: cover;
        display: none;
      }

      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #4ade80;
        display: none;
      }

      /* Content Viewport Placeholder (WebContentsView overlays this area) */
      .viewport-placeholder {
        grid-area: viewport;
        background: #08090c;
      }

      /* Full-Window Immersive Now-Playing & Lyrics Overlay */
      .immersive-overlay {
        position: fixed;
        inset: 0 0 var(--player-h) 0;
        z-index: 60;
        background: #090a0e;
        display: none;
        flex-direction: column;
        overflow: hidden;
      }

      .immersive-overlay.open {
        display: flex;
      }

      .immersive-bg {
        position: absolute;
        inset: -40px;
        background-size: cover;
        background-position: center;
        filter: blur(68px) saturate(1.45) brightness(0.36);
        transform: scale(1.1);
        z-index: 0;
        transition: background-image 350ms ease;
      }

      .immersive-scrim {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 25% 40%, rgba(15, 16, 22, 0.25), rgba(8, 9, 13, 0.84));
        z-index: 1;
      }

      .immersive-header {
        position: relative;
        z-index: 2;
        height: 58px;
        padding: 0 22px 0 92px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        -webkit-app-region: drag;
      }

      .immersive-title-tag {
        font-size: 12px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.78);
        letter-spacing: 0.04em;
      }

      .immersive-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        -webkit-app-region: no-drag;
      }

      .immersive-body {
        position: relative;
        z-index: 2;
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(260px, 360px) minmax(300px, 1fr);
        align-items: center;
        gap: 52px;
        padding: 16px 56px 36px;
        max-width: 1180px;
        width: 100%;
        margin: 0 auto;
      }

      .immersive-left {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .immersive-cover {
        width: min(300px, 32vw);
        height: min(300px, 32vw);
        border-radius: 18px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 26px 64px rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .immersive-cover img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: none;
      }

      .immersive-cover-fallback {
        font-size: 64px;
        color: rgba(255, 255, 255, 0.25);
      }

      .immersive-track-title {
        margin-top: 22px;
        font-size: 22px;
        font-weight: 700;
        color: #ffffff;
        line-height: 1.3;
        max-width: 100%;
      }

      .immersive-track-artist {
        margin-top: 6px;
        font-size: 14px;
        color: rgba(244, 244, 245, 0.74);
      }

      .lyrics-badge {
        margin-top: 14px;
        font-size: 11px;
        color: rgba(244, 244, 245, 0.78);
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.09);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }

      .immersive-lyrics-panel {
        height: 100%;
        max-height: 100%;
        overflow-y: auto;
        padding: 28% 12px 38% 0;
        mask-image: linear-gradient(to bottom, transparent 0%, #000 14%, #000 84%, transparent 100%);
        -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 14%, #000 84%, transparent 100%);
        scroll-behavior: smooth;
      }

      .immersive-lyrics-panel::-webkit-scrollbar {
        width: 0;
      }

      .lyric-line {
        font-size: 22px;
        font-weight: 700;
        line-height: 1.48;
        color: rgba(255, 255, 255, 0.34);
        padding: 10px 12px;
        border-radius: 10px;
        cursor: pointer;
        transform-origin: left center;
        transition: color 180ms ease, transform 180ms ease, background 150ms ease;
      }

      .lyric-line:hover {
        color: rgba(255, 255, 255, 0.72);
        background: rgba(255, 255, 255, 0.06);
      }

      .lyric-line.active {
        color: #ffffff;
        transform: scale(1.03);
      }

      .lyric-plain {
        font-size: 17px;
        line-height: 1.9;
        color: rgba(244, 244, 245, 0.86);
        white-space: pre-wrap;
        user-select: text;
      }

      .lyric-empty {
        font-size: 15px;
        color: rgba(244, 244, 245, 0.62);
        line-height: 1.7;
      }

      /* Bottom Native Player Bar — Responsive so Volume Slider is NEVER clipped */
      .player-bar {
        grid-area: player;
        position: relative;
        z-index: 70;
        background: var(--bg-player);
        border-top: 1px solid var(--border);
        padding: 0 18px;
        display: grid;
        grid-template-columns: minmax(150px, 1fr) minmax(240px, 1.25fr) auto;
        align-items: center;
        gap: 14px;
        overflow: hidden;
      }

      .track-info {
        display: flex;
        align-items: center;
        gap: 11px;
        min-width: 0;
        padding: 5px 8px 5px 5px;
        margin-left: -5px;
        border-radius: 10px;
        cursor: pointer;
        transition: background 120ms ease;
      }

      .track-info:hover {
        background: var(--surface-hover);
      }

      .cover-box {
        width: 48px;
        height: 48px;
        border-radius: 8px;
        overflow: hidden;
        background: #1d1f28;
        border: 1px solid var(--border);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .cover-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: none;
      }

      .cover-fallback {
        font-size: 20px;
        color: var(--text-muted);
      }

      .track-text {
        min-width: 0;
        flex: 1;
      }

      .track-title {
        font-size: 13px;
        font-weight: 600;
        color: #ffffff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .track-artist {
        margin-top: 2px;
        font-size: 11.5px;
        color: var(--text-secondary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .player-center {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }

      .transport {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .ctrl-btn {
        appearance: none;
        border: none;
        background: transparent;
        color: #e4e4e7;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background 120ms ease, transform 100ms ease, color 120ms ease;
        flex-shrink: 0;
      }

      .ctrl-btn:hover {
        background: var(--surface-hover);
        color: #ffffff;
      }

      .ctrl-btn.active {
        color: #ff3355;
        background: rgba(255, 0, 51, 0.16);
      }

      .ctrl-btn.play-main {
        width: 36px;
        height: 36px;
        background: #ffffff;
        color: #090a0e;
      }

      .ctrl-btn.play-main:hover {
        background: #f4f4f5;
        transform: scale(1.04);
      }

      .ctrl-btn svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
      }

      .text-badge-btn {
        width: auto;
        height: 28px;
        padding: 0 8px;
        border-radius: 7px;
        font-size: 12px;
        font-weight: 600;
      }

      .progress-row {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .time-label {
        font-size: 11px;
        color: var(--text-muted);
        font-variant-numeric: tabular-nums;
        width: 34px;
        flex-shrink: 0;
      }

      .time-label.right {
        text-align: right;
      }

      .progress-bar {
        flex: 1;
        height: 14px;
        display: flex;
        align-items: center;
        cursor: pointer;
        min-width: 60px;
      }

      .progress-track {
        width: 100%;
        height: 4px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.18);
        overflow: hidden;
        transition: height 120ms ease;
      }

      .progress-bar:hover .progress-track {
        height: 6px;
      }

      .progress-fill {
        height: 100%;
        width: 0%;
        background: var(--accent);
        border-radius: 999px;
        transition: width 220ms linear;
      }

      .player-right {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 6px;
        flex-shrink: 0;
        min-width: 0;
      }

      .like-btn.liked {
        color: #ff3355;
      }

      .volume-wrap {
        display: flex;
        align-items: center;
        gap: 6px;
        width: clamp(78px, 9vw, 112px);
        flex-shrink: 0;
      }

      .volume-slider {
        flex: 1;
        min-width: 48px;
        width: 100%;
        accent-color: #ffffff;
        height: 4px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-drag-header">
          <div class="brand-mark">
            <svg viewBox="0 0 16 16"><polygon points="4.5,3 13,8 4.5,13" /></svg>
          </div>
          <span class="brand-name">OpenTune</span>
        </div>

        <div class="nav-section-label">探索音乐</div>
        <nav class="nav-list">
          <button class="nav-item active" data-route="home">
            <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5.5v-6.5h-5V21H4a1 1 0 0 1-1-1z" /></svg>
            <span>首页</span>
          </button>
          <button class="nav-item" data-route="explore">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><polygon points="10,10 16,8 14,14 8,16" /></svg>
            <span>探索</span>
          </button>
          <button class="nav-item" data-route="library">
            <svg viewBox="0 0 24 24"><path d="M4 19.5V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v14.5" /><path d="M4 19.5a2.5 2.5 0 0 1 2.5-2.5H20" /></svg>
            <span>媒体库</span>
          </button>
        </nav>

        <div class="nav-section-label" style="margin-top: 8px;">我的收藏</div>
        <nav class="nav-list">
          <button class="nav-item" data-route="liked">
            <svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z" /></svg>
            <span>喜欢的音乐</span>
          </button>
          <button class="nav-item" data-route="history">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><polyline points="12 7 12 12 15 15" /></svg>
            <span>播放历史</span>
          </button>
        </nav>

        <div class="sidebar-spacer"></div>

        <div class="sidebar-footer">
          <div id="mediaKeysRow" class="toggle-row" title="开启后可在后台响应键盘与耳机播放键">
            <span>全局媒体键</span>
            <div id="mediaKeysSwitch" class="switch on"></div>
          </div>
          <div id="desktopLyricsRow" class="toggle-row" title="在桌面最前方显示透明悬浮歌词条">
            <span>桌面悬浮歌词</span>
            <div id="desktopLyricsSwitch" class="switch"></div>
          </div>

          <div class="account-card">
            <div class="account-avatar">
              <img id="sidebarAvatarImg" alt="账号头像" />
              <span id="sidebarAvatarFallback">G</span>
            </div>
            <div class="account-meta">
              <div id="sidebarAccountName" class="account-name">未登录</div>
              <div id="sidebarAccountSub" class="account-sub">使用外部浏览器登录</div>
            </div>
            <button id="sidebarAccountBtn" class="account-mini-btn">登录</button>
          </div>
        </div>
      </aside>

      <header class="topbar">
        <div class="nav-controls">
          <button id="backBtn" class="icon-btn" title="返回上一页 (⌘[)" disabled>
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6" /></svg>
          </button>
          <button id="forwardBtn" class="icon-btn" title="前进下一页 (⌘])" disabled>
            <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6" /></svg>
          </button>
          <button id="reloadBtn" class="icon-btn" title="刷新页面 (⌘R)">
            <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10" /><path d="M20.5 15a9 9 0 1 1-2.1-9.4L23 10" /></svg>
          </button>
        </div>

        <form id="searchForm" class="search-form">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></svg>
          <input id="searchInput" class="search-input" type="search" placeholder="搜索歌曲、专辑、艺人或歌单 (⌘K)" />
        </form>

        <div class="topbar-actions">
          <button id="returnHomeBtn" class="pill-btn accent">返回音乐首页</button>
          <button id="topAuthBtn" class="pill-btn">
            <img id="topAvatarImg" class="top-avatar-dot" alt="账号" />
            <span id="topStatusDot" class="status-dot"></span>
            <span id="topAuthLabel">登录账号</span>
          </button>
        </div>
      </header>

      <div class="viewport-placeholder"></div>

      <section id="immersiveOverlay" class="immersive-overlay" aria-label="沉浸播放与实时歌词">
        <div id="immersiveBg" class="immersive-bg"></div>
        <div class="immersive-scrim"></div>
        <div class="immersive-header">
          <span class="immersive-title-tag">正在播放 · 沉浸歌词</span>
          <div class="immersive-actions">
            <button id="immersiveDesktopLyricsBtn" class="pill-btn">桌面悬浮歌词</button>
            <button id="closeImmersiveBtn" class="pill-btn">收起 (ESC)</button>
          </div>
        </div>
        <div class="immersive-body">
          <div class="immersive-left">
            <div class="immersive-cover">
              <img id="immersiveCoverImg" alt="专辑封面" />
              <span id="immersiveCoverFallback" class="immersive-cover-fallback">♪</span>
            </div>
            <div id="immersiveTitle" class="immersive-track-title">未在播放</div>
            <div id="immersiveArtist" class="immersive-track-artist">OpenTune</div>
            <div id="lyricsSourceBadge" class="lyrics-badge">等待播放歌曲</div>
          </div>
          <div id="lyricsContainer" class="immersive-lyrics-panel">
            <div class="lyric-empty">开始播放音乐后，这里会自动加载实时滚动歌词，点击任意歌词行可直接跳转进度。</div>
          </div>
        </div>
      </section>

      <footer class="player-bar">
        <div id="trackInfoTrigger" class="track-info" title="点击展开沉浸播放与歌词 (⌘L)">
          <div class="cover-box">
            <img id="coverImg" alt="专辑封面" />
            <span id="coverFallback" class="cover-fallback">♪</span>
          </div>
          <div class="track-text">
            <div id="trackTitle" class="track-title">未在播放</div>
            <div id="trackArtist" class="track-artist">OpenTune</div>
          </div>
        </div>

        <div class="player-center">
          <div class="transport">
            <button id="prevBtn" class="ctrl-btn" title="上一首">
              <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z" /></svg>
            </button>
            <button id="playBtn" class="ctrl-btn play-main" title="播放 / 暂停">
              <svg id="playIcon" viewBox="0 0 24 24"><polygon points="7,5 19,12 7,19" /></svg>
            </button>
            <button id="nextBtn" class="ctrl-btn" title="下一首">
              <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" /></svg>
            </button>
          </div>
          <div class="progress-row">
            <span id="curTime" class="time-label">0:00</span>
            <div id="progressBar" class="progress-bar" title="点击跳转进度">
              <div class="progress-track">
                <div id="progressFill" class="progress-fill"></div>
              </div>
            </div>
            <span id="durTime" class="time-label right">0:00</span>
          </div>
        </div>

        <div class="player-right">
          <button id="likeBtn" class="ctrl-btn like-btn" title="喜欢这首歌">
            <svg viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;">
              <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z" />
            </svg>
          </button>
          <button id="immersiveBtn" class="ctrl-btn text-badge-btn" title="展开沉浸播放与歌词 (⌘L)">歌词</button>
          <button id="desktopLyricsBtn" class="ctrl-btn text-badge-btn" title="开关桌面悬浮歌词">词</button>
          <div class="volume-wrap">
            <button id="muteBtn" class="icon-btn" title="静音 / 取消静音">
              <svg id="volIcon" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" /><path d="M15.5 8.5a5 5 0 0 1 0 7" /><path d="M19 5a10 10 0 0 1 0 14" /></svg>
            </button>
            <input id="volumeSlider" class="volume-slider" type="range" min="0" max="100" value="100" aria-label="音量" />
          </div>
        </div>
      </footer>
    </div>

    <script>
      const navButtons = Array.from(document.querySelectorAll('.nav-item[data-route]'));
      const backBtn = document.getElementById('backBtn');
      const forwardBtn = document.getElementById('forwardBtn');
      const reloadBtn = document.getElementById('reloadBtn');
      const searchForm = document.getElementById('searchForm');
      const searchInput = document.getElementById('searchInput');
      const returnHomeBtn = document.getElementById('returnHomeBtn');
      const topAuthBtn = document.getElementById('topAuthBtn');
      const topAvatarImg = document.getElementById('topAvatarImg');
      const topStatusDot = document.getElementById('topStatusDot');
      const topAuthLabel = document.getElementById('topAuthLabel');

      const sidebarAvatarImg = document.getElementById('sidebarAvatarImg');
      const sidebarAvatarFallback = document.getElementById('sidebarAvatarFallback');
      const sidebarAccountName = document.getElementById('sidebarAccountName');
      const sidebarAccountSub = document.getElementById('sidebarAccountSub');
      const sidebarAccountBtn = document.getElementById('sidebarAccountBtn');

      const mediaKeysRow = document.getElementById('mediaKeysRow');
      const mediaKeysSwitch = document.getElementById('mediaKeysSwitch');
      const desktopLyricsRow = document.getElementById('desktopLyricsRow');
      const desktopLyricsSwitch = document.getElementById('desktopLyricsSwitch');

      const trackInfoTrigger = document.getElementById('trackInfoTrigger');
      const coverImg = document.getElementById('coverImg');
      const coverFallback = document.getElementById('coverFallback');
      const trackTitle = document.getElementById('trackTitle');
      const trackArtist = document.getElementById('trackArtist');
      const prevBtn = document.getElementById('prevBtn');
      const playBtn = document.getElementById('playBtn');
      const playIcon = document.getElementById('playIcon');
      const nextBtn = document.getElementById('nextBtn');
      const progressBar = document.getElementById('progressBar');
      const progressFill = document.getElementById('progressFill');
      const curTime = document.getElementById('curTime');
      const durTime = document.getElementById('durTime');
      const likeBtn = document.getElementById('likeBtn');
      const immersiveBtn = document.getElementById('immersiveBtn');
      const desktopLyricsBtn = document.getElementById('desktopLyricsBtn');
      const muteBtn = document.getElementById('muteBtn');
      const volumeSlider = document.getElementById('volumeSlider');

      const immersiveOverlay = document.getElementById('immersiveOverlay');
      const immersiveBg = document.getElementById('immersiveBg');
      const immersiveCoverImg = document.getElementById('immersiveCoverImg');
      const immersiveCoverFallback = document.getElementById('immersiveCoverFallback');
      const immersiveTitle = document.getElementById('immersiveTitle');
      const immersiveArtist = document.getElementById('immersiveArtist');
      const lyricsSourceBadge = document.getElementById('lyricsSourceBadge');
      const lyricsContainer = document.getElementById('lyricsContainer');
      const closeImmersiveBtn = document.getElementById('closeImmersiveBtn');
      const immersiveDesktopLyricsBtn = document.getElementById('immersiveDesktopLyricsBtn');

      let mediaKeysEnabled = true;
      let desktopLyricsEnabled = false;
      let isImmersiveOpen = false;
      let isDraggingVolume = false;
      let accountState = { loggedIn: false, name: '', avatar: '' };
      let latestTrack = { duration: 0, currentTime: 0 };
      let latestLyrics = { key: '', status: 'idle', synced: [], plain: '' };
      let renderedLyricsKey = '';
      let activeLyricIndex = -1;

      function fmt(sec) {
        const s = Math.max(0, Math.floor(sec || 0));
        const m = Math.floor(s / 60);
        const r = s % 60;
        return m + ':' + (r < 10 ? '0' + r : r);
      }

      function setActiveRoute(route) {
        navButtons.forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.route === route);
        });
      }

      function applyAccountUi(state) {
        accountState = state || { loggedIn: false, name: '', avatar: '' };
        const loggedIn = Boolean(accountState.loggedIn);
        const displayName = accountState.name || (loggedIn ? '已登录账号' : '未登录');

        if (loggedIn) {
          topAuthLabel.textContent = displayName === 'Google 账号已登录' ? '已登录' : displayName;
          topAuthBtn.title = '点击切换 Google 账号';
          sidebarAccountName.textContent = displayName;
          sidebarAccountSub.textContent = 'YouTube Music 已同步';
          sidebarAccountSub.classList.add('online');
          sidebarAccountBtn.textContent = '退出';
          sidebarAccountBtn.title = '退出当前登录账号';

          if (accountState.avatar) {
            if (topAvatarImg.src !== accountState.avatar) topAvatarImg.src = accountState.avatar;
            topAvatarImg.style.display = 'block';
            topStatusDot.style.display = 'none';

            if (sidebarAvatarImg.src !== accountState.avatar) sidebarAvatarImg.src = accountState.avatar;
            sidebarAvatarImg.style.display = 'block';
            sidebarAvatarFallback.style.display = 'none';
          } else {
            topAvatarImg.style.display = 'none';
            topStatusDot.style.display = 'inline-block';
            sidebarAvatarImg.style.display = 'none';
            sidebarAvatarFallback.style.display = 'block';
            sidebarAvatarFallback.textContent = '✓';
          }
        } else {
          topAuthLabel.textContent = '登录账号';
          topAuthBtn.title = '使用外部浏览器登录 Google 账号';
          topAvatarImg.style.display = 'none';
          topStatusDot.style.display = 'none';

          sidebarAccountName.textContent = '未登录';
          sidebarAccountSub.textContent = '外部浏览器登录';
          sidebarAccountSub.classList.remove('online');
          sidebarAccountBtn.textContent = '登录';
          sidebarAccountBtn.title = '使用外部浏览器登录 Google 账号';
          sidebarAvatarImg.style.display = 'none';
          sidebarAvatarFallback.style.display = 'block';
          sidebarAvatarFallback.textContent = 'G';
        }
      }

      function applyImmersiveUi(open, notifyMain = true) {
        isImmersiveOpen = Boolean(open);
        immersiveOverlay.classList.toggle('open', isImmersiveOpen);
        immersiveBtn.classList.toggle('active', isImmersiveOpen);
        if (notifyMain) {
          window.opentuneShell.setImmersiveOpen(isImmersiveOpen);
        }
        if (isImmersiveOpen) {
          updateActiveLyricLine(true);
        }
      }

      function applyDesktopLyricsUi(enabled) {
        desktopLyricsEnabled = Boolean(enabled);
        desktopLyricsSwitch.classList.toggle('on', desktopLyricsEnabled);
        desktopLyricsBtn.classList.toggle('active', desktopLyricsEnabled);
        immersiveDesktopLyricsBtn.textContent = desktopLyricsEnabled ? '关闭桌面歌词' : '桌面悬浮歌词';
      }

      function renderLyricsContent() {
        const state = latestLyrics;
        const signature = `${state.key}|${state.status}|${state.synced?.length || 0}|${state.plain?.length || 0}`;
        if (signature === renderedLyricsKey) return;
        renderedLyricsKey = signature;
        activeLyricIndex = -1;
        lyricsContainer.innerHTML = '';

        if (state.status === 'loading') {
          lyricsSourceBadge.textContent = '正在匹配歌词...';
          const el = document.createElement('div');
          el.className = 'lyric-empty';
          el.textContent = '正在从 LRCLIB 获取实时歌词...';
          lyricsContainer.appendChild(el);
          return;
        }

        if (Array.isArray(state.synced) && state.synced.length > 0) {
          lyricsSourceBadge.textContent = '时间轴同步歌词 · 点击行可跳转';
          state.synced.forEach((line, idx) => {
            const div = document.createElement('div');
            div.className = 'lyric-line';
            div.dataset.index = String(idx);
            div.textContent = line.text || '♪';
            div.addEventListener('click', () => {
              const dur = Number(latestTrack.duration) || 0;
              if (dur > 0) {
                window.opentuneShell.playerCommand('seek', Math.max(0, Math.min(1, line.time / dur)));
              }
            });
            lyricsContainer.appendChild(div);
          });
          updateActiveLyricLine(true);
          return;
        }

        if (state.plain) {
          lyricsSourceBadge.textContent = '纯文本歌词';
          const div = document.createElement('div');
          div.className = 'lyric-plain';
          div.textContent = state.plain;
          lyricsContainer.appendChild(div);
          return;
        }

        lyricsSourceBadge.textContent = state.status === 'not-found' ? '未找到匹配歌词' : '等待播放歌曲';
        const el = document.createElement('div');
        el.className = 'lyric-empty';
        el.textContent =
          state.status === 'not-found'
            ? '暂未匹配到这首歌的歌词（可能是纯音乐或曲名包含额外后缀）。'
            : '开始播放音乐后，这里会自动加载实时滚动歌词，点击任意歌词行可直接跳转进度。';
        lyricsContainer.appendChild(el);
      }

      function updateActiveLyricLine(forceScroll = false) {
        const synced = latestLyrics.synced;
        if (!Array.isArray(synced) || synced.length === 0) return;
        const cur = Number(latestTrack.currentTime) || 0;
        let nextIdx = -1;
        for (let i = 0; i < synced.length; i += 1) {
          if (cur + 0.25 >= synced[i].time) {
            nextIdx = i;
          } else {
            break;
          }
        }
        if (nextIdx === activeLyricIndex && !forceScroll) return;
        activeLyricIndex = nextIdx;

        const nodes = lyricsContainer.querySelectorAll('.lyric-line');
        nodes.forEach((node, idx) => {
          node.classList.toggle('active', idx === activeLyricIndex);
        });

        if (isImmersiveOpen && activeLyricIndex >= 0 && nodes[activeLyricIndex]) {
          nodes[activeLyricIndex].scrollIntoView({ behavior: forceScroll ? 'auto' : 'smooth', block: 'center' });
        }
      }

      navButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          const route = btn.dataset.route;
          if (isImmersiveOpen) applyImmersiveUi(false);
          setActiveRoute(route);
          window.opentuneShell.navigate(route);
        });
      });

      backBtn.addEventListener('click', () => {
        if (isImmersiveOpen) applyImmersiveUi(false);
        window.opentuneShell.navigate('back');
      });
      forwardBtn.addEventListener('click', () => {
        if (isImmersiveOpen) applyImmersiveUi(false);
        window.opentuneShell.navigate('forward');
      });
      reloadBtn.addEventListener('click', () => window.opentuneShell.navigate('reload'));
      returnHomeBtn.addEventListener('click', () => {
        if (isImmersiveOpen) applyImmersiveUi(false);
        window.opentuneShell.navigate('home');
      });

      topAuthBtn.addEventListener('click', () => window.opentuneShell.openAuth());
      sidebarAccountBtn.addEventListener('click', () => {
        if (accountState.loggedIn) {
          window.opentuneShell.logout();
        } else {
          window.opentuneShell.openAuth();
        }
      });

      mediaKeysRow.addEventListener('click', () => {
        mediaKeysEnabled = !mediaKeysEnabled;
        mediaKeysSwitch.classList.toggle('on', mediaKeysEnabled);
        window.opentuneShell.setMediaKeysEnabled(mediaKeysEnabled);
      });

      const toggleDesktopLyrics = () => {
        const next = !desktopLyricsEnabled;
        applyDesktopLyricsUi(next);
        window.opentuneShell.setDesktopLyricsEnabled(next);
      };

      desktopLyricsRow.addEventListener('click', toggleDesktopLyrics);
      desktopLyricsBtn.addEventListener('click', toggleDesktopLyrics);
      immersiveDesktopLyricsBtn.addEventListener('click', toggleDesktopLyrics);

      trackInfoTrigger.addEventListener('click', () => applyImmersiveUi(!isImmersiveOpen));
      immersiveBtn.addEventListener('click', () => applyImmersiveUi(!isImmersiveOpen));
      closeImmersiveBtn.addEventListener('click', () => applyImmersiveUi(false));

      searchForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const q = searchInput.value.trim();
        if (!q) return;
        if (isImmersiveOpen) applyImmersiveUi(false);
        window.opentuneShell.navigate('search', q);
        searchInput.blur();
      });

      window.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          if (isImmersiveOpen) applyImmersiveUi(false);
          searchInput.focus();
          searchInput.select();
        } else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'l') {
          e.preventDefault();
          applyImmersiveUi(!isImmersiveOpen);
        } else if (e.key === 'Escape' && isImmersiveOpen) {
          e.preventDefault();
          applyImmersiveUi(false);
        }
      });

      prevBtn.addEventListener('click', () => window.opentuneShell.playerCommand('previous'));
      playBtn.addEventListener('click', () => window.opentuneShell.playerCommand('toggle'));
      nextBtn.addEventListener('click', () => window.opentuneShell.playerCommand('next'));
      likeBtn.addEventListener('click', () => window.opentuneShell.playerCommand('toggleLike'));
      muteBtn.addEventListener('click', () => window.opentuneShell.playerCommand('toggleMute'));

      progressBar.addEventListener('click', (e) => {
        const rect = progressBar.getBoundingClientRect();
        const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        window.opentuneShell.playerCommand('seek', ratio);
      });

      volumeSlider.addEventListener('pointerdown', () => {
        isDraggingVolume = true;
      });
      window.addEventListener('pointerup', () => {
        isDraggingVolume = false;
      });
      volumeSlider.addEventListener('input', () => {
        window.opentuneShell.playerCommand('volume', Number(volumeSlider.value));
      });

      window.opentuneShell.onNavState((state) => {
        if (!state) return;
        backBtn.disabled = !state.canGoBack;
        forwardBtn.disabled = !state.canGoForward;
        returnHomeBtn.style.display = state.onMusicHome ? 'none' : 'inline-flex';
        if (state.activeRoute) {
          setActiveRoute(state.activeRoute);
        }
      });

      window.opentuneShell.onSettingsState((settings) => {
        if (!settings) return;
        if (typeof settings.enableMediaKeys === 'boolean') {
          mediaKeysEnabled = settings.enableMediaKeys;
          mediaKeysSwitch.classList.toggle('on', mediaKeysEnabled);
        }
        if (typeof settings.desktopLyricsEnabled === 'boolean') {
          applyDesktopLyricsUi(settings.desktopLyricsEnabled);
        }
        if (typeof settings.immersiveOpen === 'boolean' && settings.immersiveOpen !== isImmersiveOpen) {
          applyImmersiveUi(settings.immersiveOpen, false);
        }
      });

      window.opentuneShell.onAccountState((state) => {
        applyAccountUi(state);
      });

      window.opentuneShell.onLyricsState((state) => {
        if (!state) return;
        latestLyrics = state;
        renderLyricsContent();
      });

      window.opentuneShell.onTrackState((state) => {
        if (!state) return;
        latestTrack = state;
        const title = state.title || '未在播放';
        const artist = state.artist || 'OpenTune';
        trackTitle.textContent = title;
        trackArtist.textContent = artist;
        immersiveTitle.textContent = title;
        immersiveArtist.textContent = artist;

        playIcon.innerHTML = state.playing
          ? '<rect x="6" y="5" width="4" height="14" rx="1" /><rect x="14" y="5" width="4" height="14" rx="1" />'
          : '<polygon points="7,5 19,12 7,19" />';

        if (state.artwork) {
          if (coverImg.src !== state.artwork) coverImg.src = state.artwork;
          coverImg.style.display = 'block';
          coverFallback.style.display = 'none';

          if (immersiveCoverImg.src !== state.artwork) immersiveCoverImg.src = state.artwork;
          immersiveCoverImg.style.display = 'block';
          immersiveCoverFallback.style.display = 'none';
          immersiveBg.style.backgroundImage = `url("${state.artwork.replace(/"/g, '\\"')}")`;
        } else {
          coverImg.style.display = 'none';
          coverFallback.style.display = 'block';
          immersiveCoverImg.style.display = 'none';
          immersiveCoverFallback.style.display = 'block';
          immersiveBg.style.backgroundImage = 'none';
        }

        const dur = Number(state.duration) || 0;
        const cur = Number(state.currentTime) || 0;
        const pct = dur > 0 ? Math.max(0, Math.min(100, (cur / dur) * 100)) : 0;
        progressFill.style.width = pct + '%';
        curTime.textContent = fmt(cur);
        durTime.textContent = fmt(dur);

        likeBtn.classList.toggle('liked', Boolean(state.liked));
        const heartSvg = likeBtn.querySelector('svg');
        if (heartSvg) {
          heartSvg.style.fill = state.liked ? 'currentColor' : 'none';
        }

        if (!isDraggingVolume) {
          const vol = state.muted ? 0 : (Number.isFinite(state.volume) ? state.volume : 100);
          volumeSlider.value = String(vol);
        }

        updateActiveLyricLine(false);
      });

      window.opentuneShell.requestInitialState();
    </script>
  </body>
</html>
